name: Selenium Test Pipeline

on:
   push:
      branches: [ main ]
   pull_request:
      branches: [ main ]

jobs:
   run_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/Checkout@v3

      - name: Setup Python
        uses: actions/Setup-python@v4
        with:
          python-version: 3.11
      
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Dependencies
        run: | 
           python -m pip install
           pip install -r requirements.txt

      - name: Run Tests
        env:
          DISPLAY: :99
        run: |
           pytest -v --maxfail=1 --disable-warnings --html=report.html